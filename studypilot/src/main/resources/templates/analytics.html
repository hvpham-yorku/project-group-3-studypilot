<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics | StudyPilot</title>
    <th:block th:replace="~{fragments/tailwind :: tailwind}"></th:block>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex">
    <div th:replace="~{fragments/sidebar :: sidebar('analytics')}"></div>

    <main class="flex-1 flex flex-col min-h-screen">
      <div
        th:replace="~{fragments/header :: authHeader('Analytics', false)}"
      ></div>

      <div class="p-8 animate-fade-in-up space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div
            class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm"
          >
            <p class="text-xs text-slate-500" th:text="${metric1Label}">
              Weekly Survey Submissions
            </p>
            <p
              class="text-2xl font-bold mt-1 text-blue-600"
              th:text="${metric1Value}"
            >
              0
            </p>
          </div>
          <div
            class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm"
          >
            <p class="text-xs text-slate-500" th:text="${metric2Label}">
              Average Team Health
            </p>
            <p class="text-2xl font-bold mt-1" th:text="${metric2Value}">0%</p>
          </div>
          <div
            class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm"
          >
            <p class="text-xs text-slate-500" th:text="${metric3Label}">
              At-Risk Responses
            </p>
            <p class="text-2xl font-bold mt-1" th:text="${metric3Value}">0</p>
          </div>
        </div>

        <section
          class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm"
        >
          <h2 class="text-lg font-bold mb-4">Weekly Trend</h2>
          <div
            th:if="${hasTrendData}"
            class="grid grid-cols-5 gap-3 items-end h-52"
          >
            <div
              th:each="trend : ${weeklyTrends}"
              class="flex flex-col items-center gap-2"
            >
              <div
                class="w-full rounded-t-lg bg-blue-200 hover:bg-blue-500 transition-all duration-300"
                th:style="'height:' + ${trend.value} + '%'"
              ></div>
              <p class="text-xs text-slate-500" th:text="${trend.day}">Mon</p>
            </div>
          </div>
          <div
            th:if="${!hasTrendData}"
            class="h-52 rounded-xl border border-dashed border-slate-200 bg-slate-50 flex items-center justify-center text-sm text-slate-500"
          >
            No weekly trend yet. Submit surveys to start tracking progress.
          </div>
        </section>

        <section
          class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm"
        >
          <h2 class="text-lg font-bold mb-4">Key Insights</h2>
          <ul th:if="${!#lists.isEmpty(insights)}" class="space-y-3">
            <li
              th:each="insight : ${insights}"
              class="text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-lg p-3"
            >
              <span class="font-semibold text-blue-600 mr-2">•</span
              ><span th:text="${insight}">Insight text</span>
            </li>
          </ul>
          <div
            th:if="${#lists.isEmpty(insights)}"
            class="rounded-xl border border-dashed border-slate-200 bg-slate-50 p-4 text-sm text-slate-500"
            th:text="${insightEmptyMessage}"
          >
            No insights yet.
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
