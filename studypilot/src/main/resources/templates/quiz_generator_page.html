<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Quiz Generator</title>
</head>
<body>
<h1>AI Quiz Generator</h1>

<p>
    Course:
    <strong th:text="${courseCode} + ' - ' + ${courseName}">Course Name</strong>
</p>

<div th:if="${success}" style="color: green;">
    <p th:text="${success}"></p>
</div>

<div th:if="${error}" style="color: red;">
    <p th:text="${error}"></p>
</div>

<form th:action="@{'/prof/' + ${courseId} + '/' + ${courseSlug} + '/quiz-generator/upload'}"
      method="post"
      enctype="multipart/form-data">
    <label for="document">Upload PDF:</label>
    <input type="file" id="document" name="document" accept=".pdf" required>
    <button type="submit">Upload Document</button>
</form>

<div th:if="${uploadedFileName}">
    <p>Uploaded file: <span th:text="${uploadedFileName}"></span></p>
</div>

<br>
<a th:href="@{'/prof/' + ${courseId} + '/' + ${courseSlug}}">Back to Course Space</a>
</body>
</html>
