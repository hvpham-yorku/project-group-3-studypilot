<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Quiz Generator | StudyPilot</title>
    <th:block th:replace="~{fragments/tailwind :: tailwind}"></th:block>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex">
    <div th:replace="~{fragments/sidebar :: sidebar('courses')}"></div>

    <main class="flex-1 flex flex-col min-h-screen">
      <div
        th:replace="~{fragments/header :: authHeader(${ 'Welcome, ' + fullName + '!' }, false)}"
      ></div>

      <div class="p-8 animate-fade-in-up">
        <div class="max-w-5xl mx-auto w-full space-y-6">
          <div class="flex items-center justify-between gap-4">
            <div>
              <p class="text-sm text-slate-500">Course Space</p>
              <h1 class="text-3xl font-bold mt-1">AI Quiz Generator</h1>
              <p class="text-slate-600 mt-2">
                <span th:text="${courseCode}">EECS2311</span>
                <span> - </span>
                <span th:text="${courseName}">Software Design</span>
              </p>
            </div>

            <a
              th:href="@{'/prof/' + ${courseId} + '/' + ${courseSlug}}"
              class="inline-flex items-center justify-center px-4 py-2 rounded-lg border border-slate-300 bg-white text-sm font-semibold hover:bg-slate-100"
            >
              Back to Course Space
            </a>
          </div>

          <div
            th:if="${success}"
            class="rounded-xl border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700"
            th:text="${success}"
          >
            Upload complete.
          </div>

          <div
            th:if="${error}"
            class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
            th:text="${error}"
          >
            Upload failed.
          </div>

          <section
            class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 space-y-6"
          >
            <div>
              <h2 class="text-xl font-bold">Upload Source Material</h2>
              <p class="text-sm text-slate-500 mt-1">
                Upload a PDF to generate AI-powered quiz questions for this
                course.
              </p>
            </div>

            <form
              th:action="@{'/prof/' + ${courseId} + '/' + ${courseSlug} + '/quiz-generator/upload'}"
              method="post"
              enctype="multipart/form-data"
              class="space-y-4"
            >
              <div>
                <label
                  for="document"
                  class="block text-sm font-medium text-slate-700 mb-1"
                  >PDF Document</label
                >
                <input
                  type="file"
                  id="document"
                  name="document"
                  accept=".pdf"
                  required
                  class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm file:mr-4 file:rounded-md file:border-0 file:bg-blue-50 file:px-3 file:py-2 file:font-semibold file:text-blue-700 hover:file:bg-blue-100"
                />
              </div>

              <div class="flex justify-end">
                <button
                  type="submit"
                  class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-bold hover:bg-blue-700"
                >
                  Upload Document
                </button>
              </div>
            </form>

            <div
              th:if="${uploadedFileName}"
              class="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700"
            >
              Uploaded file:
              <span class="font-semibold" th:text="${uploadedFileName}"
                >lecture-notes.pdf</span
              >
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
