<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-in History | StudyPilot</title>
    <th:block th:replace="~{fragments/tailwind :: tailwind}"></th:block>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex">
    <div th:replace="~{fragments/sidebar :: sidebar('surveys')}"></div>

    <main class="flex-1 flex flex-col min-h-screen">
      <div th:replace="~{fragments/header :: authHeader(${'Welcome, ' + fullName + '!'}, false)}"></div>

      <div class="p-8 animate-fade-in-up space-y-6">
        <div>
          <h1 class="text-3xl font-bold">My Check-in History</h1>
          <p class="text-sm text-slate-500 mt-1">All your past weekly health check-ins.</p>
        </div>

        <div th:if="${#lists.isEmpty(history)}"
             class="bg-white border border-slate-200 rounded-2xl shadow-sm p-10 text-center">
          <p class="text-4xl mb-4">📋</p>
          <p class="text-lg font-semibold text-slate-700">No check-ins yet</p>
          <p class="text-sm text-slate-500 mt-1">You haven't submitted any weekly check-ins yet.</p>
        </div>

        <div th:if="${!#lists.isEmpty(history)}" class="space-y-4">
          <div th:each="checkin : ${history}"
               class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 max-w-5xl w-full mx-auto">
            <div class="flex items-center justify-between mb-3">
              <div>
				<p class="text-xs font-semibold text-blue-600">Course Check-in</p>
                <p class="text-sm text-slate-500 mt-0.5" th:text="'Week of ' + ${checkin.weekStart}">Week of 2026-03-23</p>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-4 text-center">
              <div class="bg-slate-50 rounded-xl p-3">
                <p class="text-xs uppercase tracking-wider text-slate-500">Health</p>
                <p class="text-2xl font-bold mt-1 text-blue-700" th:text="${checkin.healthScore} + '/5'">3/5</p>
              </div>
              <div class="bg-slate-50 rounded-xl p-3">
                <p class="text-xs uppercase tracking-wider text-slate-500">Workload</p>
                <p class="text-2xl font-bold mt-1 text-purple-700" th:text="${checkin.workloadScore} + '/5'">3/5</p>
              </div>
              <div class="bg-slate-50 rounded-xl p-3">
                <p class="text-xs uppercase tracking-wider text-slate-500">Collaboration</p>
                <p class="text-2xl font-bold mt-1 text-emerald-700" th:text="${checkin.collaborationScore} + '/5'">3/5</p>
              </div>
            </div>

            <div th:if="${checkin.statusText != null and !checkin.statusText.isBlank()}"
                 class="mt-3 rounded-xl border border-slate-200 bg-slate-50 p-3">
              <p class="text-xs uppercase tracking-wider text-slate-500 mb-1">Notes</p>
              <p class="text-sm text-slate-700" th:text="${checkin.statusText}"></p>
            </div>
          </div>
        </div>

        <div class="pt-2">
          <a href="/student/surveys"
             class="text-sm text-blue-600 hover:underline">← Back to Weekly Surveys</a>
        </div>
      </div>
    </main>
  </body>
</html>
