<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Group Formation Activity | StudyPilot</title>
    <th:block th:replace="~{fragments/tailwind :: tailwind}"></th:block>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<main class="max-w-5xl mx-auto px-6 py-8 space-y-8">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
            <p class="text-sm text-slate-500">Edit Activity</p>
            <h1 class="text-3xl font-bold">Survey-Based Group Formation</h1>
            <p class="text-slate-600 mt-2">
                <span th:text="${course.courseCode}">EECS2311</span>
                <span> - </span>
                <span th:text="${course.courseName}">Software Design</span>
            </p>
        </div>

        <a
                th:href="@{'/prof/' + ${course.id} + '/' + ${courseSlug} + '/group-formation'}"
                class="inline-flex items-center justify-center px-4 py-2 rounded-lg border border-slate-300 bg-white text-sm font-semibold hover:bg-slate-100"
        >
            Back to Activities
        </a>
    </div>

    <div
            th:if="${error}"
            class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
            th:text="${error}"
    ></div>

    <section class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 space-y-6">
        <form
                th:action="@{'/prof/' + ${course.id} + '/' + ${courseSlug} + '/group-formation/' + ${activityId} + '/edit'}"
                th:object="${form}"
                method="post"
                class="space-y-6"
        >
            <!-- Activity Name -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Activity Name</label>
                <input type="text" th:field="*{activityName}"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       required />
            </div>

            <!-- Group Sizes -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Preferred Group Size</label>
                    <input type="number" min="2" th:field="*{preferredGroupSize}"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" required />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Minimum Team Size</label>
                    <input type="number" min="2" th:field="*{minTeamSize}"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" required />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Maximum Team Size</label>
                    <input type="number" min="2" th:field="*{maxTeamSize}"
                           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" required />
                </div>
            </div>

            <!-- Deadline -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Deadline (optional)</label>
                <input type="datetime-local" th:field="*{deadline}"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
            </div>

            <!-- Survey Questions Builder -->
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-semibold">Survey Questions</h3>
                    <div class="flex gap-2">
                        <button type="button" onclick="addQuestion('SELECT')"
                                class="inline-flex items-center px-3 py-1.5 rounded-lg border border-blue-300 bg-blue-50 text-blue-700 text-sm font-medium hover:bg-blue-100">
                            + Add Select Question
                        </button>
                        <button type="button" onclick="addQuestion('RATING')"
                                class="inline-flex items-center px-3 py-1.5 rounded-lg border border-purple-300 bg-purple-50 text-purple-700 text-sm font-medium hover:bg-purple-100">
                            + Add Rating Question
                        </button>
                    </div>
                </div>
                <p class="text-xs text-slate-500">Add at least one question. Each question must have at least 2 options.</p>

                <div id="questionsContainer" class="space-y-4"></div>
            </div>

            <!-- Submit -->
            <div class="flex justify-end gap-3 pt-4">
                <a th:href="@{'/prof/' + ${course.id} + '/' + ${courseSlug} + '/group-formation'}"
                   class="px-6 py-2.5 rounded-lg border border-slate-300 bg-white text-sm font-semibold hover:bg-slate-100">
                    Cancel
                </a>
                <button type="submit"
                        class="px-6 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-bold shadow-sm hover:bg-blue-700 focus:ring-2 focus:ring-blue-400">
                    Save Changes
                </button>
            </div>
        </form>
    </section>
</main>

<script th:inline="javascript">
    var existingQuestions = /*[[${form.questions}]]*/ [];
    var questionCount = 0;

    function addQuestion(type, data) {
        var container = document.getElementById('questionsContainer');
        var idx = questionCount;
        questionCount++;

        var typeBadgeClass = (type === 'SELECT') ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700';
        var typeLabel = (type === 'SELECT') ? 'Select (one or more)' : 'Rating (1-5)';

        var div = document.createElement('div');
        div.className = 'question-block border border-slate-200 rounded-xl p-4 space-y-3 bg-slate-50';
        div.dataset.questionIndex = idx;

        var title = (data && data.title) ? data.title : '';
        var strategy = (data && data.strategy) ? data.strategy : 'SIMILAR';

        div.innerHTML =
            '<div class="flex items-center justify-between">' +
            '<div class="flex items-center gap-2">' +
            '<span class="text-xs px-2 py-0.5 rounded font-mono font-semibold ' + typeBadgeClass + '">' + type + '</span>' +
            '<span class="text-sm text-slate-500">' + typeLabel + '</span>' +
            '</div>' +
            '<button type="button" onclick="removeQuestion(this)" class="text-red-500 text-sm hover:text-red-700">Remove</button>' +
            '</div>' +
            '<input type="hidden" name="questions[' + idx + '].type" value="' + type + '" />' +
            '<div>' +
            '<label class="block text-xs font-medium text-slate-600 mb-1">Question Title</label>' +
            '<input type="text" name="questions[' + idx + '].title" value="' + escapeAttr(title) + '" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="e.g. What topic interests you?" required />' +
            '</div>' +
            '<div>' +
            '<label class="block text-xs font-medium text-slate-600 mb-1">Grouping Strategy</label>' +
            '<div class="flex gap-4">' +
            '<label class="flex items-center gap-1.5 text-sm"><input type="radio" name="questions[' + idx + '].strategy" value="SIMILAR"' + (strategy === 'SIMILAR' ? ' checked' : '') + ' class="text-blue-600" /> Similar</label>' +
            '<label class="flex items-center gap-1.5 text-sm"><input type="radio" name="questions[' + idx + '].strategy" value="DIVERSE"' + (strategy === 'DIVERSE' ? ' checked' : '') + ' class="text-blue-600" /> Diverse</label>' +
            '</div>' +
            '</div>' +
            '<div>' +
            '<label class="block text-xs font-medium text-slate-600 mb-1">Options</label>' +
            '<div class="options-container space-y-2"></div>' +
            '<button type="button" onclick="addOptionToQuestion(this)" class="mt-2 text-sm text-blue-600 hover:text-blue-800">+ Add Option</button>' +
            '</div>';

        container.appendChild(div);

        // Add options
        var options = (data && data.options && data.options.length > 0) ? data.options : ['', ''];
        var optContainer = div.querySelector('.options-container');
        for (var j = 0; j < options.length; j++) {
            addOptionElement(optContainer, idx, j, options[j]);
        }
    }

    function addOptionElement(container, qIdx, optIdx, value) {
        var div = document.createElement('div');
        div.className = 'flex gap-2';
        div.innerHTML =
            '<input type="text" name="questions[' + qIdx + '].options[' + optIdx + ']" value="' + escapeAttr(value || '') + '" class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Option ' + (optIdx + 1) + '" required />' +
            '<button type="button" onclick="removeOptionFromQuestion(this)" class="text-red-400 text-sm hover:text-red-600 px-2">x</button>';
        container.appendChild(div);
    }

    function removeQuestion(btn) {
        btn.closest('.question-block').remove();
        reindexAllQuestions();
    }

    function addOptionToQuestion(btn) {
        var optionsContainer = btn.parentElement.querySelector('.options-container');
        var optCount = optionsContainer.querySelectorAll('input[type=text]').length;
        var qBlock = btn.closest('.question-block');
        var qIdx = qBlock.dataset.questionIndex;
        addOptionElement(optionsContainer, qIdx, optCount, '');
    }

    function removeOptionFromQuestion(btn) {
        var optionsContainer = btn.closest('.options-container');
        if (optionsContainer.querySelectorAll('input[type=text]').length <= 2) {
            alert('Each question must have at least 2 options.');
            return;
        }
        btn.parentElement.remove();
        reindexOptions(optionsContainer);
    }

    function reindexAllQuestions() {
        var blocks = document.querySelectorAll('.question-block');
        questionCount = blocks.length;
        for (var i = 0; i < blocks.length; i++) {
            var block = blocks[i];
            block.dataset.questionIndex = i;
            var typeInput = block.querySelector('input[type=hidden]');
            if (typeInput) typeInput.name = 'questions[' + i + '].type';
            var titleInput = block.querySelector('input[name*=".title"]');
            if (titleInput) titleInput.name = 'questions[' + i + '].title';
            var radios = block.querySelectorAll('input[type=radio]');
            for (var r = 0; r < radios.length; r++) {
                radios[r].name = 'questions[' + i + '].strategy';
            }
            var optInputs = block.querySelectorAll('.options-container input[type=text]');
            for (var j = 0; j < optInputs.length; j++) {
                optInputs[j].name = 'questions[' + i + '].options[' + j + ']';
            }
        }
    }

    function reindexOptions(container) {
        var qBlock = container.closest('.question-block');
        var qIdx = qBlock.dataset.questionIndex;
        var inputs = container.querySelectorAll('input[type=text]');
        for (var j = 0; j < inputs.length; j++) {
            inputs[j].name = 'questions[' + qIdx + '].options[' + j + ']';
        }
    }

    function escapeAttr(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Load existing questions on page load
    document.addEventListener('DOMContentLoaded', function() {
        if (existingQuestions && existingQuestions.length > 0) {
            for (var i = 0; i < existingQuestions.length; i++) {
                var q = existingQuestions[i];
                addQuestion(q.type || 'SELECT', q);
            }
        } else {
            addQuestion('SELECT');
        }
    });
</script>
</body>
</html>
