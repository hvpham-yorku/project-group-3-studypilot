<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI FAQ Library | StudyPilot</title>
    <th:block th:replace="~{fragments/tailwind :: tailwind}"></th:block>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex">
    <div th:replace="~{fragments/sidebar :: sidebar('faq')}"></div>

    <main class="flex-1 flex flex-col min-h-screen">
      <div
        th:replace="~{fragments/header :: authHeader('AI FAQ Library', true)}"
      ></div>

      <div class="p-8 animate-fade-in-up">
        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
          <div class="flex items-center justify-between mb-5">
            <h2 class="text-lg font-bold">Frequently Reused Responses</h2>
            <span
              class="text-xs px-3 py-1 rounded-full bg-blue-100 text-blue-700 font-semibold"
              >Demo Data</span
            >
          </div>

          <div class="space-y-4">
            <article
              th:each="item : ${faqItems}"
              class="rounded-xl border border-slate-200 bg-slate-50 p-4 hover:bg-white hover:border-blue-200 transition-all"
            >
              <div class="flex items-start justify-between gap-4">
                <div>
                  <p
                    class="text-xs text-blue-600 font-semibold"
                    th:text="${item.category}"
                  >
                    Exam Policy
                  </p>
                  <h3 class="text-sm font-bold mt-1" th:text="${item.question}">
                    Question
                  </h3>
                </div>
                <span
                  class="text-[11px] px-2.5 py-1 rounded-full bg-slate-200 text-slate-700 font-semibold"
                  th:text="${item.timesUsed + ' uses'}"
                  >124 uses</span
                >
              </div>
              <p class="text-sm text-slate-600 mt-3" th:text="${item.answer}">
                Answer content.
              </p>
            </article>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
