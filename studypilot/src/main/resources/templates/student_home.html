<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Home | StudyPilot</title>
    <th:block th:replace="~{fragments/tailwind :: tailwind}"></th:block>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex">
    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

    <main class="flex-1 flex flex-col min-h-screen">
      <div
        th:replace="~{fragments/header :: authHeader(${ 'Welcome, ' + fullName + '!' }, false)}"
      ></div>

      <div class="p-8 animate-fade-in-up space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div
            class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5"
          >
            <p class="text-xs text-slate-500">Enrolled Courses</p>
            <p
              class="text-2xl font-bold mt-1"
              th:text="${#lists.size(courses)}"
            >
              0
            </p>
          </div>
          <div
            class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5"
          >
            <p class="text-xs text-slate-500">Open Courses To Join</p>
            <p
              class="text-2xl font-bold mt-1"
              th:text="${#lists.size(availableCourses)}"
            >
              0
            </p>
          </div>
          <div
            class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5"
          >
            <p class="text-xs text-slate-500">Status</p>
            <p class="text-base font-bold mt-2 text-blue-600">
              Learning in progress
            </p>
          </div>
        </div>

        <p
          th:if="${error}"
          class="text-sm text-red-700 bg-red-50 border border-red-200 px-4 py-3 rounded-xl"
          th:text="${error}"
        >
          Error
        </p>

        <section
          class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 space-y-4"
        >
          <div>
            <h2 class="text-xl font-bold">Join a Course</h2>
            <p class="text-sm text-slate-500 mt-1">
              Enter the 8-character Course ID shared by your professor.
            </p>
          </div>

          <form
            th:action="@{/student/course/join}"
            th:object="${joinForm}"
            method="post"
            class="grid grid-cols-1 md:grid-cols-[1fr_auto] gap-3"
          >
            <input
              th:field="*{joinCode}"
              type="text"
              maxlength="8"
              placeholder="e.g., A1B2C3D4"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white uppercase tracking-wider"
              required
            />
            <button
              type="submit"
              class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-bold hover:bg-blue-700"
            >
              Enroll
            </button>
          </form>
        </section>

        <section class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold">My Courses</h2>
          </div>

          <div
            th:if="${#lists.isEmpty(courses)}"
            class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 text-sm text-slate-500"
          >
            You are not enrolled in any courses yet.
          </div>

          <div
            th:if="${!#lists.isEmpty(courses)}"
            class="grid grid-cols-1 lg:grid-cols-2 gap-5"
          >
            <a
              th:each="course : ${courses}"
              th:href="@{/student/{courseId}/{courseSlug}(courseId=${course.id},courseSlug=${course.courseSlug})}"
              class="block bg-white rounded-2xl border border-slate-200 p-6 shadow-sm hover:border-blue-300 transition-all"
            >
              <p
                class="text-xs font-semibold text-blue-600"
                th:text="${course.courseCode}"
              >
                EECS2311
              </p>
              <h3 class="text-lg font-bold mt-1" th:text="${course.courseName}">
                Software Design
              </h3>
              <p class="text-sm text-slate-500 mt-2">Open course space</p>
            </a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
