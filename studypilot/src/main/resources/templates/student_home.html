<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Home | StudyPilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {
              "fade-in-up": "fadeInUp 0.5s ease-out forwards",
            },
            keyframes: {
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(10px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex">
    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

    <main class="flex-1 p-8 animate-fade-in-up">
      <h1 class="text-2xl font-bold">Student Dashboard</h1>
      <p class="text-slate-600 mt-2">
        Welcome, <span th:text="${fullName}">Student</span>!
      </p>
    </main>
  </body>
</html>
