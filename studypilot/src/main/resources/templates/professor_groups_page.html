<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formed Groups | StudyPilot</title>
    <th:block th:replace="~{fragments/tailwind :: tailwind}"></th:block>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex">
    <div th:replace="~{fragments/sidebar :: sidebar('courses')}"></div>

    <main class="flex-1 flex flex-col min-h-screen">
      <div
        th:replace="~{fragments/header :: authHeader('Formed Groups', false)}"
      ></div>

      <div class="p-8 animate-fade-in-up space-y-8">
        <div class="max-w-7xl mx-auto w-full space-y-8">
          <!-- Header -->
          <div
            class="flex flex-col md:flex-row md:items-center md:justify-between gap-4"
          >
            <div>
              <p class="text-sm text-slate-500">Group Formation Results</p>
              <h1 class="text-3xl font-bold">
                <span th:text="${activity.activityName}">Activity</span>
              </h1>
              <p class="text-slate-600 mt-2">
                <span th:text="${course.courseCode}">EECS2311</span>
                <span> - </span>
                <span th:text="${course.courseName}">Software Design</span>
              </p>
            </div>
            <a
              th:href="@{'/prof/' + ${course.id} + '/' + ${courseSlug} + '/group-formation'}"
              class="inline-flex items-center justify-center px-4 py-2 rounded-lg border border-slate-300 bg-white text-sm font-semibold hover:bg-slate-100"
            >
              Back to Group Formation
            </a>
          </div>

          <!-- Summary Stats -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div
              class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 text-center"
            >
              <p class="text-3xl font-bold text-blue-600" th:text="${#lists.size(groups)}">
                0
              </p>
              <p class="text-sm text-slate-500 mt-1">Groups Formed</p>
            </div>
            <div
              class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 text-center"
            >
              <p
                class="text-3xl font-bold text-green-600"
                th:text="${responseStatus.respondedCount}"
              >
                0
              </p>
              <p class="text-sm text-slate-500 mt-1">Survey Responses</p>
            </div>
            <div
              class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5 text-center"
            >
              <p
                class="text-3xl font-bold text-slate-700"
                th:text="${responseStatus.totalEnrolled}"
              >
                0
              </p>
              <p class="text-sm text-slate-500 mt-1">Total Students</p>
            </div>
          </div>

          <!-- Drag-and-drop instruction -->
          <div th:if="${!#lists.isEmpty(groups)}" class="text-sm text-slate-500 bg-blue-50 border border-blue-200 rounded-xl px-4 py-3">
            Drag and drop students between groups to reassign them.
          </div>

          <!-- Groups Grid -->
          <div
            th:if="${#lists.isEmpty(groups)}"
            class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 text-sm text-slate-500 text-center"
          >
            No groups have been formed yet.
          </div>

          <div
            th:if="${!#lists.isEmpty(groups)}"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
          >
            <div
              th:each="group : ${groups}"
              th:data-group-id="${group.groupId}"
              class="group-drop-zone bg-white border-2 border-slate-200 rounded-2xl shadow-sm p-6 space-y-4 transition-colors"
              ondragover="onDragOver(event)"
              ondragleave="onDragLeave(event)"
              ondrop="onDrop(event)"
            >
              <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold" th:text="${group.groupName}">
                  Team Name
                </h3>
                <span
                  class="member-count text-xs px-2.5 py-1 rounded-full bg-blue-100 text-blue-700 font-semibold"
                  th:text="${#lists.size(group.members) + ' members'}"
                >
                  0 members
                </span>
              </div>

              <div class="members-list space-y-2">
                <div
                  th:each="member : ${group.members}"
                  th:data-student-id="${member.studentId}"
                  th:data-group-id="${group.groupId}"
                  class="student-row flex items-center gap-3 px-3 py-2 rounded-lg bg-slate-50 cursor-grab active:cursor-grabbing"
                  draggable="true"
                  ondragstart="onDragStart(event)"
                  ondragend="onDragEnd(event)"
                >
                  <div class="flex-shrink-0 text-slate-400 select-none" title="Drag to move">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 8h16M4 16h16" />
                    </svg>
                  </div>
                  <div
                    class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 text-xs font-bold flex-shrink-0"
                    th:text="${#strings.substring(member.fullName, 0, 1).toUpperCase()}"
                  >
                    S
                  </div>
                  <div class="min-w-0">
                    <p
                      class="text-sm font-medium truncate"
                      th:text="${member.fullName}"
                    >
                      Student Name
                    </p>
                    <p
                      class="text-xs text-slate-400 truncate"
                      th:text="${member.email}"
                    >
                      email@example.com
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script th:inline="javascript">
      var moveUrl = /*[[@{'/prof/' + ${course.id} + '/' + ${courseSlug} + '/group-formation/' + ${activity.id} + '/move-student'}]]*/ '';
      var draggedStudent = null;

      function onDragStart(e) {
        draggedStudent = e.currentTarget;
        e.dataTransfer.setData('text/plain', '');
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(function() {
          draggedStudent.classList.add('opacity-50');
        }, 0);
      }

      function onDragEnd(e) {
        e.currentTarget.classList.remove('opacity-50');
        draggedStudent = null;
        // Remove all hover states
        var zones = document.querySelectorAll('.group-drop-zone');
        for (var i = 0; i < zones.length; i++) {
          zones[i].classList.remove('border-blue-400', 'bg-blue-50');
        }
      }

      function onDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        var zone = e.currentTarget;
        zone.classList.add('border-blue-400', 'bg-blue-50');
      }

      function onDragLeave(e) {
        e.currentTarget.classList.remove('border-blue-400', 'bg-blue-50');
      }

      function onDrop(e) {
        e.preventDefault();
        var zone = e.currentTarget;
        zone.classList.remove('border-blue-400', 'bg-blue-50');

        if (!draggedStudent) return;

        var toGroupId = zone.dataset.groupId;
        var studentId = draggedStudent.dataset.studentId;
        var fromGroupId = draggedStudent.dataset.groupId;

        if (fromGroupId === toGroupId) return;

        fetch(moveUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'studentId=' + studentId + '&fromGroupId=' + fromGroupId + '&toGroupId=' + toGroupId
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            // Move DOM element to new group
            var membersList = zone.querySelector('.members-list');
            draggedStudent.dataset.groupId = toGroupId;
            membersList.appendChild(draggedStudent);
            updateMemberCounts();
          } else {
            alert(data.error || 'Failed to move student.');
          }
        })
        .catch(function() {
          alert('Network error. Please try again.');
        });
      }

      function updateMemberCounts() {
        var zones = document.querySelectorAll('.group-drop-zone');
        for (var i = 0; i < zones.length; i++) {
          var count = zones[i].querySelectorAll('.student-row').length;
          var badge = zones[i].querySelector('.member-count');
          if (badge) {
            badge.textContent = count + ' member' + (count !== 1 ? 's' : '');
          }
        }
      }
    </script>
  </body>
</html>
