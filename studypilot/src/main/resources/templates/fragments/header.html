<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <header
      th:fragment="authHeader(title, showNotification)"
      class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8"
    >
      <h1 class="font-bold text-lg text-slate-800" th:text="${title}">
        Dashboard
      </h1>
      <div class="flex items-center gap-4">
        <button
          th:if="${showNotification}"
          class="p-2 bg-slate-100 rounded-full text-sm"
        >
          🔔
        </button>
        <div
          class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-xs"
        >
          <span
            th:text="${#strings.isEmpty(fullName) or #strings.isEmpty(#strings.trim(fullName)) ? 'P' : #strings.toUpperCase(#strings.substring(#strings.trim(fullName), 0, 1))}"
            >P</span
          >
        </div>
      </div>
    </header>
  </body>
</html>
