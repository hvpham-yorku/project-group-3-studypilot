<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <header
      th:fragment="authHeader(title, showNotification)"
      class="h-16 flex items-center justify-between px-8"
      style="background: #fffdf8; border-bottom: 1px solid #dfd2be"
    >
      <h1 class="font-bold text-lg" style="color: #1f2a37" th:text="${title}">
        Dashboard
      </h1>
      <div class="flex items-center gap-4">
        <button
          th:if="${showNotification}"
          class="p-2 rounded-full text-sm"
          style="background: #fff3ea; border: 1px solid #f2d8ca"
        >
          🔔
        </button>
        <div
          class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-xs"
          style="background: #c85a39"
        >
          <span
            th:text="${#strings.isEmpty(fullName) or #strings.isEmpty(#strings.trim(fullName)) ? 'P' : #strings.toUpperCase(#strings.substring(#strings.trim(fullName), 0, 1))}"
            >P</span
          >
        </div>
      </div>
    </header>
  </body>
</html>
