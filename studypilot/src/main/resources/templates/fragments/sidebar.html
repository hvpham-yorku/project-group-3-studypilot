<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <aside
      th:fragment="sidebar(activePage)"
      class="w-64 flex-col hidden md:flex"
      style="background: #fffdf8; border-right: 1px solid #dfd2be"
    >
      <div
        class="p-6 flex items-center gap-2"
        style="border-bottom: 1px solid #efe4d2"
      >
        <div
          class="w-8 h-8 rounded-lg flex items-center justify-center text-white"
          style="background: #c85a39"
        >
          ✦
        </div>
        <span class="font-bold text-xl" style="color: #1f2a37">GroupPilot</span>
      </div>

      <nav class="flex-1 p-4 space-y-2">
        <!-- Both roles: Red Flags / Dashboard -->
        <a
          th:href="${session.role == 'STUDENT'} ? '/student/home' : '/prof/home'"
          class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors"
          th:classappend="${activePage == 'dashboard'} ? ' bg-orange-50 text-orange-700 font-medium border border-orange-200' : ' text-slate-600 hover:bg-orange-50'"
        >
          <span>📊</span> Dashboard
        </a>

        <!-- Professor only: Courses & Teams -->
        <a
          th:if="${session.role == 'PROFESSOR'}"
          href="/courses"
          class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors"
          th:classappend="${activePage == 'courses'} ? ' bg-orange-50 text-orange-700 font-medium border border-orange-200' : ' text-slate-600 hover:bg-orange-50'"
        >
          <span>📚</span> Courses &amp; Teams
        </a>

        <!-- Student only: My Courses -->
        <a
          th:if="${session.role == 'STUDENT'}"
          href="/student/courses"
          class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors"
          th:classappend="${activePage == 'courses'} ? ' bg-orange-50 text-orange-700 font-medium border border-orange-200' : ' text-slate-600 hover:bg-orange-50'"
        >
          <span>📚</span> My Courses
        </a>

        <!-- Student only: Weekly Surveys -->
        <a
          th:if="${session.role == 'STUDENT'}"
          href="/student/surveys"
          class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors"
          th:classappend="${activePage == 'surveys'} ? ' bg-orange-50 text-orange-700 font-medium border border-orange-200' : ' text-slate-600 hover:bg-orange-50'"
        >
          <span>📝</span> Weekly Surveys
        </a>

        <!-- Both roles: Team Analytics -->
        <a
          href="/analytics"
          class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors"
          th:classappend="${activePage == 'analytics'} ? ' bg-orange-50 text-orange-700 font-medium border border-orange-200' : ' text-slate-600 hover:bg-orange-50'"
        >
          <span>📈</span> Team Analytics
        </a>

        <!-- Both roles: Settings -->
        <a
          href="/settings"
          class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors"
          th:classappend="${activePage == 'settings'} ? ' bg-orange-50 text-orange-700 font-medium border border-orange-200' : ' text-slate-600 hover:bg-orange-50'"
        >
          <span>⚙️</span> Settings
        </a>
      </nav>

      <div class="p-4" style="border-top: 1px solid #efe4d2">
        <form th:action="@{/logout}" method="post">
          <button
            type="submit"
            class="w-full flex items-center gap-3 px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors"
          >
            <span>🚪</span> Logout
          </button>
        </form>
      </div>
    </aside>
  </body>
</html>
