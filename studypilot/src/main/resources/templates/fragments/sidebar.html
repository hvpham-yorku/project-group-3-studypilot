<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <aside
      th:fragment="sidebar(activePage)"
      class="w-64 bg-white border-r border-slate-200 flex-col hidden md:flex"
    >
      <div class="p-6 flex items-center gap-2 border-b border-slate-50">
        <div
          class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white"
        >
          ✦
        </div>
        <span class="font-bold text-xl">StudyPilot</span>
      </div>

      <nav class="flex-1 p-4 space-y-2">
        <a
          th:href="${session.role == 'STUDENT'} ? '/student/home' : '/prof/home'"
          class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors"
          th:classappend="${activePage == 'dashboard'} ? ' bg-blue-50 text-blue-600 font-medium' : ' text-slate-600 hover:bg-slate-50'"
        >
          <span>🏠</span> Dashboard
        </a>
        <a
          href="/courses"
          class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors"
          th:classappend="${activePage == 'courses'} ? ' bg-blue-50 text-blue-600 font-medium' : ' text-slate-600 hover:bg-slate-50'"
        >
          <span>📚</span> My Courses
        </a>
        <a
          href="/faq-library"
          class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors"
          th:classappend="${activePage == 'faq'} ? ' bg-blue-50 text-blue-600 font-medium' : ' text-slate-600 hover:bg-slate-50'"
        >
          <span>🤖</span> AI FAQ Library
        </a>
        <a
          href="/analytics"
          class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors"
          th:classappend="${activePage == 'analytics'} ? ' bg-blue-50 text-blue-600 font-medium' : ' text-slate-600 hover:bg-slate-50'"
        >
          <span>📊</span> Analytics
        </a>
        <a
          href="/settings"
          class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors"
          th:classappend="${activePage == 'settings'} ? ' bg-blue-50 text-blue-600 font-medium' : ' text-slate-600 hover:bg-slate-50'"
        >
          <span>⚙️</span> Settings
        </a>
      </nav>

      <div class="p-4 border-t border-slate-100">
        <form th:action="@{/logout}" method="post">
          <button
            type="submit"
            class="w-full flex items-center gap-3 px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors"
          >
            <span>🚪</span> Logout
          </button>
        </form>
      </div>
    </aside>
  </body>
</html>
