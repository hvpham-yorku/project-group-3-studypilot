<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Test | StudyPilot</title>
    <th:block th:replace="~{fragments/tailwind :: tailwind}"></th:block>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex">
    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

    <main class="flex-1 flex flex-col min-h-screen">
      <div
        th:replace="~{fragments/header :: authHeader(${ 'Welcome, ' + fullName + '!' }, false)}"
      ></div>

      <div class="p-8 animate-fade-in-up">
        <div class="max-w-5xl mx-auto w-full space-y-6">
          <div class="flex items-center justify-between gap-4">
            <div>
              <p class="text-sm text-slate-500">Course Space</p>
              <h1 class="text-3xl font-bold mt-1">Quiz Test</h1>
              <p class="text-slate-600 mt-2">
                <span th:text="${course.courseCode}">EECS2311</span>
                <span> - </span>
                <span th:text="${course.courseName}">Software Design</span>
              </p>
            </div>
            <a
              th:href="@{/student/{courseId}/{courseSlug}(courseId=${course.id},courseSlug=${courseSlug})}"
              class="inline-flex items-center justify-center px-4 py-2 rounded-lg border border-slate-300 bg-white text-sm font-semibold hover:bg-slate-100"
            >
              Back to Course
            </a>
          </div>

          <p
            th:if="${error}"
            class="text-sm text-red-700 bg-red-50 border border-red-200 px-4 py-3 rounded-xl"
            th:text="${error}"
          >
            Error
          </p>

          <section
            th:if="${quiz == null}"
            class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 text-sm text-slate-500"
          >
            No quiz is available for this course yet.
          </section>

          <section th:if="${quiz != null}" class="space-y-6">
            <div
              class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6"
            >
              <h2 class="text-xl font-bold" th:text="${quiz.title}">
                Auto Quiz
              </h2>
              <p class="text-sm text-slate-500 mt-1">
                Source: <span th:text="${quiz.sourceFileName}">notes.pdf</span>
              </p>
              <p
                th:if="${latestSubmission}"
                class="mt-3 text-sm text-blue-700 bg-blue-50 border border-blue-200 px-3 py-2 rounded-lg"
              >
                Your latest score:
                <strong th:text="${latestSubmission.score}">4</strong>/<span
                  th:text="${latestSubmission.totalQuestions}"
                  >5</span
                >
              </p>
            </div>

            <form
              th:action="@{/student/{courseId}/{courseSlug}/quiz/submit(courseId=${course.id},courseSlug=${courseSlug})}"
              method="post"
              class="space-y-4"
            >
              <input type="hidden" name="quizId" th:value="${quiz.id}" />

              <article
                th:each="question : ${questions}"
                class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 space-y-4"
              >
                <h3
                  class="font-bold"
                  th:text="${question.questionOrder} + '. ' + ${question.questionText}"
                >
                  Question text
                </h3>

                <div class="space-y-2 text-sm">
                  <label
                    class="flex items-start gap-3 rounded-lg border border-slate-200 p-3 hover:border-blue-300 cursor-pointer"
                  >
                    <input
                      type="radio"
                      th:name="${'q_' + question.id}"
                      value="A"
                      required
                    />
                    <span
                      ><strong>A.</strong>
                      <span th:text="${question.optionA}">Option A</span></span
                    >
                  </label>
                  <label
                    class="flex items-start gap-3 rounded-lg border border-slate-200 p-3 hover:border-blue-300 cursor-pointer"
                  >
                    <input
                      type="radio"
                      th:name="${'q_' + question.id}"
                      value="B"
                      required
                    />
                    <span
                      ><strong>B.</strong>
                      <span th:text="${question.optionB}">Option B</span></span
                    >
                  </label>
                  <label
                    class="flex items-start gap-3 rounded-lg border border-slate-200 p-3 hover:border-blue-300 cursor-pointer"
                  >
                    <input
                      type="radio"
                      th:name="${'q_' + question.id}"
                      value="C"
                      required
                    />
                    <span
                      ><strong>C.</strong>
                      <span th:text="${question.optionC}">Option C</span></span
                    >
                  </label>
                  <label
                    class="flex items-start gap-3 rounded-lg border border-slate-200 p-3 hover:border-blue-300 cursor-pointer"
                  >
                    <input
                      type="radio"
                      th:name="${'q_' + question.id}"
                      value="D"
                      required
                    />
                    <span
                      ><strong>D.</strong>
                      <span th:text="${question.optionD}">Option D</span></span
                    >
                  </label>
                </div>
              </article>

              <div class="flex justify-end">
                <button
                  type="submit"
                  class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-bold hover:bg-blue-700"
                >
                  Submit Quiz
                </button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
