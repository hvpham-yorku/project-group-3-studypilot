<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Courses | StudyPilot</title>
    <th:block th:replace="~{fragments/tailwind :: tailwind}"></th:block>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex">
    <div th:replace="~{fragments/sidebar :: sidebar('courses')}"></div>

    <main class="flex-1 flex flex-col min-h-screen">
      <div
        th:replace="~{fragments/header :: authHeader('My Courses', false)}"
      ></div>

      <div class="p-8 animate-fade-in-up space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div
            class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm"
          >
            <p class="text-xs text-slate-500">Total Courses</p>
            <p
              class="text-2xl font-bold mt-1"
              th:text="${#lists.size(courses)}"
            >
              3
            </p>
          </div>
          <div
            class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm"
          >
            <p class="text-xs text-slate-500">Total Enrolled Students</p>
            <p class="text-2xl font-bold mt-1">869</p>
          </div>
          <div
            class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm"
          >
            <p class="text-xs text-slate-500">Courses Requiring Review</p>
            <p class="text-2xl font-bold mt-1 text-amber-600">1</p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <article
            th:each="course : ${courses}"
            class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm hover:border-blue-300 transition-all"
          >
            <div class="flex items-start justify-between gap-4">
              <div>
                <p
                  class="text-xs font-semibold text-blue-600"
                  th:text="${course.code}"
                >
                  EECS2311
                </p>
                <h2 class="text-lg font-bold mt-1" th:text="${course.name}">
                  Software Design
                </h2>
                <p
                  class="text-sm text-slate-500 mt-2"
                  th:text="${course.schedule}"
                >
                  Mondays 2:30 PM
                </p>
              </div>
              <span
                class="text-[11px] px-3 py-1 rounded-full font-semibold"
                th:classappend="${course.status == 'Active'} ? ' bg-green-100 text-green-700' : ' bg-amber-100 text-amber-700'"
                th:text="${course.status}"
                >Active</span
              >
            </div>
            <div
              class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between text-sm"
            >
              <p class="text-slate-500">Students</p>
              <p class="font-bold" th:text="${course.students}">312</p>
            </div>
          </article>
        </div>
      </div>
    </main>
  </body>
</html>
