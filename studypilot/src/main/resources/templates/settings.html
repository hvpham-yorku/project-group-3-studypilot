<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | StudyPilot</title>
    <th:block th:replace="~{fragments/tailwind :: tailwind}"></th:block>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex">
    <div th:replace="~{fragments/sidebar :: sidebar('settings')}"></div>

    <main class="flex-1 flex flex-col min-h-screen">
      <div
        th:replace="~{fragments/header :: authHeader('Account Settings', false)}"
      ></div>

      <div class="p-8 max-w-4xl mx-auto w-full animate-fade-in-up">
        <div
          class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden"
        >
          <div class="p-8 border-b border-slate-100">
            <h2 class="text-xl font-bold">Profile Information</h2>
            <p class="text-sm text-slate-500">
              Update your personal details and how students see your profile.
            </p>
          </div>

          <div class="p-8 space-y-6">
            <div class="grid md:grid-cols-3 gap-4 items-center">
              <label class="text-sm font-medium text-slate-700"
                >Full Name</label
              >
              <div class="md:col-span-2">
                <input
                  type="text"
                  th:value="${fullName}"
                  class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600/20 outline-none transition-all"
                  placeholder="Professor Name"
                />
              </div>
            </div>

            <div class="grid md:grid-cols-3 gap-4 items-center">
              <label class="text-sm font-medium text-slate-700"
                >Email Address</label
              >
              <div class="md:col-span-2">
                <input
                  type="email"
                  th:value="${email}"
                  placeholder="prof@university.ca"
                  class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600/20 outline-none transition-all"
                />
              </div>
            </div>

            <hr class="border-slate-100 my-4" />

            <div class="grid md:grid-cols-3 gap-4">
              <div>
                <h3 class="text-sm font-medium text-slate-700">AI Workflow</h3>
                <p class="text-xs text-slate-500 mt-1">
                  Configure your academic force multiplier settings.
                </p>
              </div>
              <div class="md:col-span-2 space-y-4">
                <div
                  class="flex items-center justify-between p-4 bg-blue-50 rounded-2xl border border-blue-100"
                >
                  <div>
                    <p class="text-sm font-bold text-blue-900">
                      "Answer Once" Mode
                    </p>
                    <p class="text-xs text-blue-700">
                      AI automatically handles repeat student questions.
                    </p>
                  </div>
                  <label
                    class="relative inline-flex items-center cursor-pointer"
                  >
                    <input type="checkbox" checked class="sr-only peer" />
                    <div
                      class="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"
                    ></div>
                  </label>
                </div>

                <div
                  class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-200"
                >
                  <div>
                    <p class="text-sm font-bold text-slate-900">
                      Advanced STEM Rendering
                    </p>
                    <p class="text-xs text-slate-500">
                      Enable LaTeX and diagram extraction.
                    </p>
                  </div>
                  <label
                    class="relative inline-flex items-center cursor-pointer"
                  >
                    <input type="checkbox" checked class="sr-only peer" />
                    <div
                      class="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"
                    ></div>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div
            class="p-6 bg-slate-50 border-t border-slate-100 flex justify-end gap-3"
          >
            <button
              class="px-5 py-2 text-sm font-bold text-slate-600 hover:text-slate-900 transition-colors"
            >
              Cancel
            </button>
            <button
              class="px-5 py-2 text-sm font-bold bg-blue-600 text-white rounded-lg shadow-md shadow-blue-200 hover:bg-blue-700 transition-all active:scale-95"
            >
              Save Settings
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
